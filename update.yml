name: Update blocklist
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python merge.py
      - run: |
          git config user.name "blocklist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blocklist.txt
          git diff --cached --quiet || git commit -m "Daily blocklist update"
          git push
